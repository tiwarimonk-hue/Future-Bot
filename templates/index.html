<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Funding Arbitrage Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .table { color: #e0e0e0; }
        .log-box { background: #000; color: #00ff66; padding: 15px; height: 250px; overflow-y: scroll; font-size: 12px; border-radius: 5px; }
        .badge-running { background-color: #28a745; }
        .badge-stopped { background-color: #dc3545; }
    </style>
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>⚡ Binance Negative Funding Arbitrage Bot</h2>
        <div>
            Status: <span id="bot-status" class="badge badge-stopped">STOPPED</span>
        </div>
    </div>

    <!-- Control Panel -->
    <div class="card mb-4 p-3">
        <h5>API Configuration & Control</h5>
        <div class="row g-3 mt-2">
            <div class="col-md-4">
                <input type="text" id="api_key" class="form-control bg-dark text-light" placeholder="Binance API Key">
            </div>
            <div class="col-md-4">
                <input type="password" id="secret_key" class="form-control bg-dark text-light" placeholder="Binance Secret Key">
            </div>
            <div class="col-md-2">
                <button onclick="startBot()" class="btn btn-success w-100">Start Bot</button>
            </div>
            <div class="col-md-2">
                <button onclick="stopBot()" class="btn btn-danger w-100">Stop Bot</button>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Armed & Scanned Coins -->
        <div class="col-md-6 mb-4">
            <div class="card p-3 h-100">
                <h5>🎯 Armed / Scanned Coins (&lt;= -0.4%)</h5>
                <div class="table-responsive mt-3" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-dark table-sm">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Funding %</th>
                                <th>Next Funding</th>
                            </tr>
                        </thead>
                        <tbody id="armed-table">
                            <tr><td colspan="3" class="text-center text-muted">Scanning...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Trade History -->
        <div class="col-md-6 mb-4">
            <div class="card p-3 h-100">
                <h5>📜 Trade Executions</h5>
                <div class="table-responsive mt-3" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-dark table-sm">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Action</th>
                                <th>Price</th>
                            </tr>
                        </thead>
                        <tbody id="trades-table">
                            <tr><td colspan="4" class="text-center text-muted">No trades yet</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- System Logs -->
    <div class="card p-3">
        <h5>🖥️ System Logs</h5>
        <div id="log-box" class="log-box mt-2">Initializing logs...</div>
    </div>

    <script>
        function startBot() {
            let apiKey = document.getElementById('api_key').value;
            let secretKey = document.getElementById('secret_key').value;
            fetch('/api/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({api_key: apiKey, secret_key: secretKey})
            }).then(res => res.json()).then(data => alert(data.message));
        }

        function stopBot() {
            fetch('/api/stop', {method: 'POST'}).then(res => res.json()).then(data => alert(data.message));
        }

        setInterval(() => {
            fetch('/api/status').then(res => res.json()).then(data => {
                let badge = document.getElementById('bot-status');
                badge.innerText = data.status;
                badge.className = data.status === 'RUNNING' ? 'badge badge-running' : 'badge badge-stopped';

                let armedHtml = '';
                if(data.armed_coins.length === 0) {
                    armedHtml = `<tr><td colspan="3" class="text-center text-muted">No coins meeting threshold (-0.4%)</td></tr>`;
                } else {
                    data.armed_coins.forEach(c => {
                        armedHtml += `<tr><td><b>${c.symbol}</b></td><td class="text-success">${c.funding_rate.toFixed(3)}%</td><td>${c.time_str}</td></tr>`;
                    });
                }
                document.getElementById('armed-table').innerHTML = armedHtml;

                let tradesHtml = '';
                if(data.trades.length === 0) {
                    tradesHtml = `<tr><td colspan="4" class="text-center text-muted">No trades executed</td></tr>`;
                } else {
                    data.trades.forEach(t => {
                        tradesHtml += `<tr><td>${t.time}</td><td><b>${t.symbol}</b></td><td><span class="${t.type==='ENTRY'?'text-info':'text-warning'}">${t.type}</span></td><td>${t.price}</td></tr>`;
                    });
                }
                document.getElementById('trades-table').innerHTML = tradesHtml;

                document.getElementById('log-box').innerText = data.logs.join('\n');
            });
        }, 3000);
    </script>
</body>
</html>
